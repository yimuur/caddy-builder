name: Build Caddy with Latest Stable Version

on:
  schedule:
    # 每天检查一次是否有新版本；有新版本才构建，无新版本则跳过
    - cron: '0 6 * * *'
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/caddy-pass
  SOURCE_REPO: caddyserver/caddy

jobs:
  resolve-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------- 解析最新稳定版 tag ----------
      - name: Resolve latest Caddy release
        id: caddy_version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(gh release view --repo ${{ env.SOURCE_REPO }} --json tagName -q '.tagName')
          if [ -z "$LATEST_TAG" ]; then
            echo "::error::Failed to resolve latest Caddy release"
            exit 1
          fi
          # 剥离 v 前缀：v2.11.8 -> 2.11.8
          VERSION="${LATEST_TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved latest Caddy version: ${VERSION}"

      # ---------- 检查该版本是否已存在，避免重复构建 ----------
      - name: Check if image already exists
        id: check_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.caddy_version.outputs.version }}
        run: |
          EXISTS=$(gh api \
            "/users/${{ github.repository_owner }}/packages/container/caddy-custom/versions" \
            --jq '.[].metadata.container.tags[]' 2>/dev/null \
            | grep -qx "${VERSION}" && echo "true" || echo "false")
          echo "exists=${EXISTS}" >> "$GITHUB_OUTPUT"

      # 以下步骤仅在版本不存在时执行
      # ---------- 准备 Buildx（GHA 缓存后端必需） ----------
      - name: Set up Docker Buildx
        if: steps.check_tag.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.check_tag.outputs.exists == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------- 集中管理插件列表 ----------
      # 按需增删；每行一个 --with
      - name: Define Caddy plugins
        if: steps.check_tag.outputs.exists == 'false'
        id: plugins
        run: |
          PLUGINS=""
          PLUGINS="$PLUGINS --with github.com/caddy-dns/cloudflare"
          PLUGINS="$PLUGINS --with github.com/mholt/caddy-ratelimit"
          PLUGINS="$PLUGINS --with github.com/greenpau/caddy-security"
          PLUGINS="$PLUGINS --with github.com/WeidiDeng/caddy-cloudflare-ip"
          PLUGINS="$PLUGINS --with github.com/mholt/caddy-dynamicdns"
          echo "CADDY_PLUGINS=$PLUGINS" >> "$GITHUB_ENV"

      # ---------- 构建到本地（不推送），用于测试 ----------
      - name: Build image for testing
        if: steps.check_tag.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: caddy-custom:test
          build-args: |
            CADDY_VERSION=${{ steps.caddy_version.outputs.version }}
            CADDY_PLUGINS=${{ env.CADDY_PLUGINS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------- 冒烟测试：用最小 Caddyfile 启动并验证 HTTP ----------
      - name: Smoke test
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          cat > /tmp/Caddyfile <<'EOF'
          :80 {
            respond "ok" 200
          }
          EOF
          docker run -d --name smoke -p 8080:80 \
            -v /tmp/Caddyfile:/etc/caddy/Caddyfile:ro \
            caddy-custom:test
          sleep 3
          curl -fsS http://localhost:8080/ || { docker logs smoke; docker rm -f smoke; exit 1; }
          docker rm -f smoke

      # ---------- Trivy 扫描：CRITICAL 级别阻断推送 ----------
      - name: Scan with Trivy
        if: steps.check_tag.outputs.exists == 'false'
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: 'caddy-custom:test'
          exit-code: '1'
          severity: 'CRITICAL'
          ignore-unfixed: true

      # ---------- 测试和扫描均通过，正式推送 ----------
      - name: Push final image
        if: steps.check_tag.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.caddy_version.outputs.version }}
          build-args: |
            CADDY_VERSION=${{ steps.caddy_version.outputs.version }}
            CADDY_PLUGINS=${{ env.CADDY_PLUGINS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
