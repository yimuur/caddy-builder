name: Build Caddy with Latest Stable Version

on:
  schedule:
    # 每天检查一次是否有新版本；有新版本才构建，无新版本则跳过
    - cron: '0 6 * * *'
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/caddy-pass

jobs:
  resolve-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------- 解析 Docker Hub 上最新的稳定版 Caddy ----------
      - name: Resolve latest Caddy version from Docker Hub
        id: caddy_version
        run: |
          API_URL="https://hub.docker.com/v2/namespaces/library/repositories/caddy/tags?page_size=100&ordering=last_updated"
          RESPONSE=$(curl -fsS "$API_URL")

          # 仅保留形如 X.Y.Z-builder-alpine 的标签，排除浮动标签和预发布版本
          TAGS=$(echo "$RESPONSE" | jq -r '.results[].name' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+-builder-alpine$' || true)

          if [ -z "$TAGS" ]; then
            echo "::error::Docker Hub 上未找到任何版本化的 builder-alpine 标签"
            exit 1
          fi

          # 按语义版本排序，取最新一个
          LATEST_TAG=$(echo "$TAGS" | sort -V | tail -n 1)
          VERSION="${LATEST_TAG%-builder-alpine}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved latest Caddy version from Docker Hub: ${VERSION} (tag: ${LATEST_TAG})"

      # ---------- 登录 GHCR（提前，供 manifest 检查和后续推送） ----------
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------- 检查标签是否已存在（手动触发强制构建） ----------
      - name: Check if image tag already exists
        id: check_tag
        env:
          VERSION: ${{ steps.caddy_version.outputs.version }}
        run: |
          # 手动触发时强制构建，以便应用插件变更
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Manual trigger: forcing build."
            exit 0
          fi

          IMAGE="${{ env.IMAGE_NAME }}:${VERSION}"
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $IMAGE already exists, skipping build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag $IMAGE not found, build will proceed."
          fi

      # ---------- 准备 Buildx（GHA 缓存后端必需） ----------
      - name: Set up Docker Buildx
        if: steps.check_tag.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3

      # ---------- 集中管理插件列表 ----------
      - name: Define Caddy plugins
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          PLUGINS=""
          PLUGINS="$PLUGINS --with github.com/caddy-dns/cloudflare"
          PLUGINS="$PLUGINS --with github.com/mholt/caddy-ratelimit"
          PLUGINS="$PLUGINS --with github.com/greenpau/caddy-security"
          PLUGINS="$PLUGINS --with github.com/WeidiDeng/caddy-cloudflare-ip"
          PLUGINS="$PLUGINS --with github.com/mholt/caddy-dynamicdns"
          # 按需继续添加或删减...
          echo "CADDY_PLUGINS=$PLUGINS" >> "$GITHUB_ENV"

      # ---------- 构建到本地（同时打测试标签和最终标签），用于测试 ----------
      - name: Build image for testing
        if: steps.check_tag.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: |
            caddy-pass:test
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.caddy_version.outputs.version }}
          build-args: |
            CADDY_VERSION=${{ steps.caddy_version.outputs.version }}
            CADDY_PLUGINS=${{ env.CADDY_PLUGINS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------- 冒烟测试：轮询重试，验证 HTTP 响应 ----------
      - name: Smoke test
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          cat > /tmp/Caddyfile <<'EOF'
          :80 {
            respond "ok" 200
          }
          EOF

          docker run -d --name smoke -p 8080:80 \
            -v /tmp/Caddyfile:/etc/caddy/Caddyfile:ro \
            caddy-pass:test

          SUCCESS=0
          for i in $(seq 1 10); do
            if curl -fsS http://localhost:8080/ > /dev/null 2>&1; then
              SUCCESS=1
              break
            fi
            sleep 1
          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo "Smoke test failed. Container logs:"
            docker logs smoke
            docker rm -f smoke
            exit 1
          fi

          echo "Smoke test passed."
          docker rm -f smoke

      # ---------- Trivy 扫描：CRITICAL 级别阻断推送 ----------
      - name: Scan with Trivy
        if: steps.check_tag.outputs.exists == 'false'
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: 'caddy-pass:test'
          exit-code: '1'
          severity: 'CRITICAL'
          ignore-unfixed: true

      # ---------- 测试和扫描均通过，直接推送已测试的镜像 ----------
      - name: Push tested image
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          docker push ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:${{ steps.caddy_version.outputs.version }}
